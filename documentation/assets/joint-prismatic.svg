<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 58 180 184">
  <!--
    Prismatic: a slider running up and down a track between two stops. Same base
    and viewBox as the other joint diagrams so it can sit beside them at
    matching scale.

    Still frame: the dotted travel line and the two stop ticks carry it.
  -->
  <style>
    svg { --ink: #1a1a1a; --paper: #f4f1ea; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e3e0da; --paper: #1d1d1d; }
    }
  </style>
  <defs>
    <pattern id="hatch-p" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--ink)" stroke-opacity="0.35" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="150" y="210" width="100" height="26" fill="url(#hatch-p)" stroke="var(--ink)" stroke-width="3"/>

  <!-- the track, and the stops at each end of the travel -->
  <line x1="200" y1="86" x2="200" y2="196" stroke="var(--ink)" stroke-opacity="0.3"
        stroke-width="3" stroke-dasharray="6 8"/>
  <line x1="176" y1="86" x2="224" y2="86" stroke="var(--ink)" stroke-opacity="0.55" stroke-width="5"/>
  <line x1="176" y1="196" x2="224" y2="196" stroke="var(--ink)" stroke-opacity="0.55" stroke-width="5"/>

  <!-- The slider starts flush against the top stop and travels exactly far
       enough to meet the bottom one: 196 - (86 + 34). -->
  <g>
    <rect x="168" y="86" width="64" height="34" rx="5" fill="var(--ink)"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 76; 0 0"
                      keyTimes="0; 0.5; 1"
                      calcMode="spline"
                      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
                      dur="3.2s" repeatCount="indefinite"/>
  </g>
</svg>
